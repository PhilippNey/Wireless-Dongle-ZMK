---
include:
  # Dongle: zentrale Seite, mit ZMK Studio
  - board: halcyon_dongle
    shield: sofle_choc_pro_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sofle_dongle

  # Linke Hälfte: jetzt Peripheral, ohne Studio
  - board: sofle_choc_pro_left
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_STUDIO=n
    artifact-name: sofle_choc_pro_bt_left_peripheral

  # Rechte Hälfte: unverändert Peripheral
  - board: sofle_choc_pro_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: sofle_choc_pro_bt_right

  # Reset-Firmware für alle drei Geräte
  - board: halcyon_dongle
    shield: settings_reset
    artifact-name: reset_dongle
  - board: sofle_choc_pro_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: sofle_choc_pro_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart
